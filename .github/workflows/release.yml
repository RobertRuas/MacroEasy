name: Release

# Publishes a release whenever main carries a version that has no release yet.
# The version comes from pom.xml; the notes from release-notes/v<version>.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven
      - name: Read the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "A release v$version já existe; nada a publicar."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.exists == 'false'
        run: mvn -B package
      - name: Publish the release with the jar
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          notes="release-notes/${TAG}.md"
          [ -f "$notes" ] || { echo "Versão ${TAG#v}." > /tmp/notes.md; notes=/tmp/notes.md; }
          gh release create "$TAG" target/MacroEasy.jar --target "$GITHUB_SHA" \
            --title "MacroEasy ${TAG#v}" --notes-file "$notes" --latest
